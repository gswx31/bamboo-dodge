<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  #osBoot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--paper, #efe6d2); }
  #osBoot div { width: 160px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink, #1d1a16) 12%, transparent); overflow: hidden; }
  #osBootFill { width: 0%; height: 100%; background: var(--seal, #b8322a); transition: width 0.2s; }
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대나무 피하기</title>
<meta name="description" content="날아오는 칼을 피해 오래 버티는 게임. 한 대라도 맞으면 끝.">
<meta property="og:title" content="대나무 피하기">
<meta property="og:description" content="한 대라도 맞으면 끝. 몇 초나 버틸 수 있을까?">
<meta property="og:type" content="website">
<meta name="theme-color" content="#efe6d2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='8' fill='%23efe6d2' stroke='%23b8322a' stroke-width='5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23b8322a' font-family='serif' font-weight='900'%3E%E7%AB%B9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
  :root { color-scheme: light; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  /* Layout: one screen — the bamboo grove fills the frame; brush-lettered HUD floats over it,
     menus are paper slips pinned in the middle. One committed look: ink on rice paper. */
  :root {
    --paper: #efe6d2;
    --paper-deep: #e2d5b8;
    --ink: #1d1a17;
    --ink-soft: #5b5248;
    --seal: #c8321f;
    --bamboo: #6f8a4a;
    --slip: #f7f0de;
    --font-brush: "Nanum Brush Script", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-mark: "Noto Serif KR", "Batang", serif;
    color-scheme: light;
  }
  html, body { height: 100%; height: 100dvh; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  /* the safe insets in one place: the browser's own by default, overwritten by a store wrapper that
     reports them (inside its frame the browser's env() insets read 0) */
  :root { --sa-top: env(safe-area-inset-top, 0px); --sa-right: env(safe-area-inset-right, 0px); --sa-bottom: env(safe-area-inset-bottom, 0px); --sa-left: env(safe-area-inset-left, 0px); }
  #app { position: relative; height: 100%; overflow: hidden; touch-action: none; }
  #cv { position: absolute; inset: 0; display: block; }

  .hud {
    transition: opacity .3s;
    position: absolute; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-top: calc(10px + var(--sa-top));
    padding-left: max(16px, var(--sa-left));
    padding-right: max(16px, var(--sa-right));
    pointer-events: none;
  }
  .hud__time { font-family: var(--font-brush); font-size: clamp(44px, 11vw, 72px); line-height: .9; font-variant-numeric: tabular-nums; }
  .hud__time small { font-size: .45em; margin-left: 2px; color: var(--ink-soft); }
  .hud__side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hud__stage { font-family: var(--font-mark); font-weight: 900; font-size: 14px; letter-spacing: .08em; color: var(--ink-soft); }
  .mute {
    pointer-events: auto; border: 1.5px solid var(--ink); background: var(--slip); color: var(--ink);
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .mute:focus-visible, .btn:focus-visible, .nick:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
  .screen {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding-block: calc(24px + var(--sa-top)) calc(24px + var(--sa-bottom));
    padding-left: max(16px, var(--sa-left));
    padding-right: max(16px, var(--sa-right));
    background: color-mix(in srgb, var(--paper) 55%, transparent);
    overflow-y: auto; overflow-x: hidden; /* a slip a few pixels too wide for a narrow phone must not let the menu slide sideways */
  }
  .slip {
    width: min(420px, 100%);
    background: var(--slip);
    border: 1.5px solid var(--ink);
    box-shadow: 6px 6px 0 color-mix(in srgb, var(--ink) 18%, transparent);
    padding: 22px 20px 20px;
    display: grid; gap: 14px;
    position: relative;
  }
  .slip::after { /* the red seal in the corner */
    content: attr(data-seal);
    position: absolute; top: 14px; right: 14px;
    width: 46px; height: 46px; display: grid; place-items: center;
    border: 2.5px solid var(--seal); color: var(--seal); border-radius: 6px;
    font-family: var(--font-mark); font-weight: 900; font-size: 22px; transform: rotate(-8deg);
  }
  .title { font-family: var(--font-brush); font-size: clamp(64px, 19vw, 92px); line-height: .82; margin: 0; text-wrap: balance; }
  .title small { display: block; font-family: var(--font-mark); font-size: 15px; letter-spacing: .5em; color: var(--ink-soft); margin-top: 10px; }
  .lead { margin: 0; color: var(--ink-soft); line-height: 1.6; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .nick {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1.5px solid var(--ink); background: #fffaf0; color: var(--ink); border-radius: 0;
  }
  .btn {
    font-family: var(--font-mark); font-weight: 900; font-size: 18px; letter-spacing: .12em;
    border: 1.5px solid var(--ink); background: var(--ink); color: var(--slip);
    padding: 12px 18px; cursor: pointer; border-radius: 0;
  }
  .btn:active { transform: translate(2px, 2px); }
  .btn--ghost { background: transparent; color: var(--ink); }
  .keys { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; color: var(--ink-soft); }
  .keys b { color: var(--ink); font-weight: 400; font-family: var(--font-mark); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode {
    font: inherit; text-align: center; display: grid; place-content: center; gap: 2px; min-height: 64px; cursor: pointer; border-radius: 0;
    border: 1.5px solid var(--ink); background: var(--ink); color: var(--slip); padding: 12px 10px;
  }
  .mode b { font-family: var(--font-mark); font-weight: 900; font-size: 18px; letter-spacing: .06em; }
  .mode small { font-size: 12px; opacity: .85; }
  .mode--story { background: var(--seal); border-color: var(--seal); }
  .mode--main { background: var(--seal); border-color: var(--seal); } /* the game itself, first of the four */
  .mode--hard { background: #4a1410; border-color: #4a1410; }
  .mode--mon { background: #2f6b4a; border-color: #2f6b4a; }
  .rank__tabs { display: flex; gap: 6px; margin: -2px 0 6px; }
  .rank__tabs button { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--ink-soft); background: transparent; color: var(--ink-soft); cursor: pointer; border-radius: 0; }
  .rank__tabs button.is-on { border-color: var(--ink); background: var(--ink); color: var(--slip); }
  .mode--ghost { background: transparent; color: var(--ink); }
  .mode:active { transform: translate(2px, 2px); }
  .mode:focus-visible, .link:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
  .link { justify-self: start; background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }

  .result { display: grid; gap: 2px; }
  .result__label { font-family: var(--font-mark); font-weight: 700; font-size: 14px; letter-spacing: .3em; color: var(--ink-soft); }
  .result__time { font-family: var(--font-brush); font-size: 84px; line-height: .9; font-variant-numeric: tabular-nums; }
  .result__time small { font-size: .4em; color: var(--ink-soft); }
  .result__meta { font-size: 14px; color: var(--ink-soft); }
  .result__best { color: var(--seal); font-family: var(--font-mark); font-weight: 900; }

  .rank h2 { margin: 0 0 6px; font-family: var(--font-mark); font-weight: 900; font-size: 15px; letter-spacing: .2em; }
  .rank ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .rank li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: baseline; padding: 4px 2px; border-bottom: 1px dotted color-mix(in srgb, var(--ink) 30%, transparent); font-size: 15px; }
  .rank li.is-me { color: var(--seal); }
  .rank li span:first-child { font-family: var(--font-mark); font-weight: 900; }
  .rank li span:last-child { font-variant-numeric: tabular-nums; font-family: var(--font-mark); font-weight: 700; }
  .rank__nick { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank__note { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }

  .btn--revive { width: 100%; background: var(--seal); border-color: var(--seal); }
  .btn:disabled { opacity: .55; cursor: default; }
  .shop-open { font: inherit; font-family: var(--font-mark); font-weight: 700; font-size: 15px; letter-spacing: .12em; padding: 10px 12px; cursor: pointer; border-radius: 0; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
  .shop-open:active { transform: translate(2px, 2px); }
  .shop-open.has-new::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; background: var(--seal); vertical-align: 2px; } /* a new set of clothes waiting */
  .shop-title { font-family: var(--font-brush); font-weight: 400; font-size: 56px; line-height: .9; margin: 0; }
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .skin { display: grid; justify-items: center; gap: 6px; padding: 10px 8px; border: 1.5px solid var(--ink); }
  .skin.is-on { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .skin canvas { width: 72px; height: 72px; }
  .skin--wide { grid-column: 1 / -1; grid-template-columns: 1fr minmax(96px, auto); justify-items: start; align-items: center; column-gap: 12px; row-gap: 2px; }
  .skin--wide small { grid-column: 1; font-size: 12px; color: var(--ink-soft); }
  .skin--wide button { grid-column: 2; grid-row: 1 / span 2; }
  .skin b { font-family: var(--font-mark); font-weight: 900; font-size: 16px; letter-spacing: .06em; }
  .skin button { font: inherit; font-size: 13px; width: 100%; padding: 6px 4px; cursor: pointer; border-radius: 0; border: 1.5px solid var(--ink); background: var(--ink); color: var(--slip); }
  .skin button:disabled { background: transparent; color: var(--ink-soft); border-color: var(--ink-soft); cursor: default; }
  .shop-note { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .shop-open:focus-visible, .skin button:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
  .purse { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .coins { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mark); font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums; }
  .coin { display: inline-block; flex: none; width: 15px; height: 15px; border-radius: 50%; background: #b08d4a; box-shadow: inset 0 0 0 1.5px #8a6c34; position: relative; }
  .coin::after { content: ""; position: absolute; left: 5px; top: 5px; width: 5px; height: 5px; background: var(--slip); box-shadow: 0 0 0 1px #8a6c34; } /* 葉錢: the square hole */
  .drill { border: 1px dotted var(--ink-soft); padding: 10px 12px; display: grid; gap: 6px; }
  .drill__head { display: flex; justify-content: space-between; align-items: baseline; }
  .drill h2 { margin: 0; font-family: var(--font-mark); font-weight: 900; font-size: 15px; letter-spacing: .08em; }
  .drill__head span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .drill ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .drill li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .drill li span:last-child { color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .drill li.is-done span:first-child { color: var(--ink-soft); text-decoration: line-through; }
  .drill li.is-done span:last-child { color: var(--seal); }
  .drill__note { margin: 0; font-size: 13px; color: var(--seal); }
  .result__coin { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mark); font-weight: 700; font-size: 15px; }
  .btn--double { width: 100%; background: #8a6c34; border-color: #8a6c34; }
  .shop-purse { margin: -4px 0 0; }

  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<div id="osBoot"><div><div id="osBootFill"></div></div></div>
<script>setTimeout(() => document.getElementById("osBoot")?.remove(), 10000);</script>

<div id="app">
  <canvas id="cv" aria-label="대나무 피하기 게임 화면"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud__time"><span id="time">0.00</span><small>초</small></div>
    <div class="hud__side">
      <div class="hud__stage" id="stage">一段 · 첫 칼</div>
      <button class="mute" id="mute" aria-label="소리 켜고 끄기">♪</button>
    </div>
  </div>

  <div class="screen" id="start">
    <section class="slip" data-seal="竹">
      <h1 class="title">대나무 피하기<small>竹林飛劍</small></h1>
      <p class="lead">청죽문이 불탄 어느 밤, 살아남은 제자는 너 하나</p>
      <ul class="keys">
        <li><b>이동</b> 화면 아무 데나 대고 끌기. 키보드는 방향키나 WASD</li>
        <li><b>간발</b> 아슬아슬하게 피하면 시간이 는다</li>
      </ul>
      <input class="nick" id="nick" maxlength="10" placeholder="검객 이름" autocomplete="off">
      <div class="modes">
        <button class="mode mode--story" id="story" hidden><b>스토리모드</b><small id="storySub" hidden></small></button>
        <button class="mode mode--main" id="goStage"><b>스테이지모드</b><small id="stageSub" hidden></small></button>
        <button class="mode" id="goNormal"><b>일반모드</b></button>
        <button class="mode mode--ghost" id="go"><b>특수 효과만</b></button>
        <button class="mode mode--hard" id="goHard"><b>하드모드</b></button>
        <button class="mode mode--mon" id="goMon" hidden><b>요괴전</b></button>
      </div>
      <button class="link" id="storyNew" hidden>스토리모드 처음부터</button>
      <button class="link" id="stageNew" hidden>스테이지 1-1부터</button>
      <div class="purse">
        <button class="shop-open" id="shopOpen">상점</button>
        <span class="coins" aria-label="가진 엽전"><i class="coin" aria-hidden="true"></i><span id="coins">0</span></span>
      </div>
      <div class="drill">
        <div class="drill__head"><h2>오늘의 수련</h2><span id="drillCount"></span></div>
        <ol id="drillList"></ol>
        <p class="drill__note" id="drillNote" hidden></p>
      </div>
      <div class="rank" id="rankStart" hidden>
        <h2>죽림 명부</h2>
        <div class="rank__tabs"><button data-mode="normal">일반모드</button><button data-mode="red">특수 효과만</button><button data-mode="hard">하드모드</button><button data-mode="mon" hidden>요괴전</button></div>
        <ol></ol>
        <p class="rank__note"></p>
      </div>
    </section>
  </div>

  <div class="screen" id="shop" hidden>
    <section class="slip" data-seal="衣">
      <h2 class="shop-title">상점</h2>
      <span class="coins shop-purse" aria-label="가진 엽전"><i class="coin" aria-hidden="true"></i><span id="shopCoins">0</span></span>
      <div class="shop-grid" id="shopGrid"></div>
      <p class="shop-note" id="shopNote"></p>
      <button class="btn btn--ghost" id="shopClose">돌아가기</button>
    </section>
  </div>

  <div class="screen" id="over" hidden>
    <section class="slip" data-seal="敗" id="overSlip">
      <div class="result">
        <span class="result__label" id="overLabel">버틴 시간</span>
        <span class="result__time"><span id="score">0.00</span><small id="scoreUnit">초</small></span>
        <span class="result__meta" id="meta"></span>
        <span class="result__best" id="best"></span>
        <span class="result__coin" id="coinGain"></span>
      </div>
      <button class="btn btn--revive" id="revive" hidden>광고 보고 이어하기</button>
      <button class="btn btn--double" id="double" hidden>광고 보고 엽전 두 배</button>
      <div class="row">
        <button class="btn" id="again">다 시</button>
        <button class="btn btn--ghost" id="home">처음으로</button>
      </div>
      <div class="rank" id="rankOver" hidden>
        <h2>죽림 명부</h2>
        <ol></ol>
        <p class="rank__note"></p>
      </div>
    </section>
  </div>
</div>

<script type="module">
// 대나무 피하기 ⇄ 원스토어 웹게임: the One Store H5 Game SDK around the same page the web plays.
//
// build.mjs writes this file into a copy of public/index.html as the first module, before the game's script.
// The game never imports the SDK; this file talks to it through window.JUKLIM_GAME (pause, resume, silent switch,
// back key, safe insets), which the game sets once its own script has run, and answers the game's ads and shop
// through window.JUKLIM_PLATFORM.
//
// Ads, once AD holds the placement ids from the console ([수익화 > 인앱 광고]; there are no test ids):
//   - interstitial: at a break, every fifth run (not for someone who bought 광고 제거; the game skips it)
//   - rewarded: revive, double 엽전. A reward counts only once ONE store has told our server (SSV, worker/src/onestore.js),
//     which the console must know: 콜백 서버 = SERVER + "/onestore/ssv", with the API key the worker holds.
// In-app purchases (managed products, kept forever): 광고 제거 and the two paid clothes. ONE store wants every purchase
// checked and acknowledged by the game's server (unacknowledged ones are cancelled after three days), and the web SDK
// has no purchase history, so the server keeps who owns what, by the player's ONE store playerId.
import { createSDK } from "https://h5sdk.onestore.net/lib/v1.1.0/onestore-h5-sdk.min.js";

const AD = { interstitial: "", rewarded: "" };
const SKUS = ["juklim_noads", "juklim_skin_heuk", "juklim_skin_mae"]; // the console's In-App IDs, exactly
const SERVER = "https://bamboo-dodge-scores.gswx31.workers.dev"; // the same Cloudflare worker as the 명부
// known only after init: what this version of the app supports, and who is playing
let breakAds = false, rewardAds = false, canBuy = false, canPrice = false, playerId = "";

const sdk = createSDK();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const server = async (path, body) => {
  const res = await fetch(SERVER + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  return { status: res.status, body: await res.json().catch(() => ({})) };
};
const newId = () => crypto.randomUUID?.() ?? [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");

// ---- ads
async function showBreakAd() {
  if (!breakAds) return false;
  const r = await sdk.ads.showInterstitialAsync({ placementId: AD.interstitial }); // never rejects; failed is fine too
  sdk.ads.loadInterstitial({ placementId: AD.interstitial }); // the next one, ready for the next break
  return r.status === "completed";
}
// true only for an ad watched to the end AND confirmed to our server by ONE store (it usually lands within a second or two)
async function showRewardAd() {
  if (!rewardAds) return false;
  const requestId = "r" + newId();
  const r = await sdk.ads.showRewardedAsync({ placementId: AD.rewarded, requestId });
  sdk.ads.loadRewarded({ placementId: AD.rewarded });
  if (r.status !== "rewarded") return false; // closed early, or no ad to show: nothing is owed
  for (let i = 0; i < 20; i++) {
    try { if ((await server(`/onestore/reward/${requestId}`)).body.ok) return true; } catch { /* the network blinked: ask again */ }
    await wait(600);
  }
  return false;
}

// ---- purchases. A purchase not yet confirmed by the server (the network dropped, the app was closed) waits in
// localStorage and is tried again at the next start, well inside ONE store's three days.
const PENDING = "juklim.osPending";
const pending = () => { try { return JSON.parse(localStorage.getItem(PENDING) || "[]"); } catch { return []; } };
const setPending = (list) => { try { localStorage.setItem(PENDING, JSON.stringify(list)); } catch { /* private mode */ } };
async function confirm(sku, purchaseToken) {
  for (let i = 0; i < 3; i++) {
    try {
      const r = await server("/onestore/iap/verify", { productId: sku, purchaseToken, playerId });
      if (r.body.ok) { setPending(pending().filter((p) => p.purchaseToken !== purchaseToken)); return true; }
      if (r.status < 500) { setPending(pending().filter((p) => p.purchaseToken !== purchaseToken)); return false; } // ONE store says no

    o.connect(g).connect(sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }

  // ---- instruments, shared by the effects and the music. Each takes a start time and a bus.
  function rasp(t, gain, bus, type, freq, len, q = 1) { // a short shaped noise
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;

    const g = ac.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);

  function ksBuf(freq) { // a plucked string (Karplus–Strong): noise in a loop that softens every time round
    const key = Math.round(freq * 10); if (ksCache.has(key)) return ksCache.get(key);

  // ------------------------------------------------------------------ music: 羽調 (A C D E G)
  // A plucked 箏 over 鼓 and 木魚, a 笛子 on top. It reads the fight and plays along: quiet at first,
  // the drums arriving, and in 광란 everything at once. A gong marks each step up. It never uses 板 —
  // that sound belongs to the warning, and must never be mistaken for the beat.
  const SC = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];

    if (G.mode !== "play") return -1;
    if (G.stageRun) return Math.min(3, Math.floor(stageDef(G.sg).w / 3) + (G.boss ? 1 : 0));
    if (G.story) return Math.min(2, Math.floor(G.ch / 2) + (G.boss ? 1 : 0));
    const l = G.stage < 3 ? 0 : G.stage < 7 ? 1 : G.t < FRENZY ? 2 : 3;

  function reset() {
    Object.assign(G, {
      t: 0, rt: 0, bonus: 0, near: 0, combo: 0, comboT: 0, stage: 0, slow: 1, slowT: 0, shake: 0,
      shots: [], warns: [], cuts: [], hazards: [], parts: [], texts: [], decals: [], timers: {}, dieT: 0,
      flash: 0, zoom: 0, stopT: 0, dark: 0, bigT: 0, lastBig: "",

  // 죽림 수련: bamboo is the main thing to dodge and the red attacks come about half as often, as surprises

  const EASE = 1.4;

  const HARD = { clock: 1.5, start: 16, warn: 1.3, twice: 0.4, follow: 0.35 };
  const hard = () => G.kind === "hard" && !G.story;
  function aimPoint() {
    return hard() && Math.random() < 0.5 ? [rnd(S * 0.08, W - S * 0.08), rnd(S * 0.12, H - S * 0.08)] : [P.x, P.y];
  }

  /** The steady attacks: when each opens, its first wait, and its spawn. `pace` < 1 as time runs on. */
  const pace = () => Math.max(0.34, 1 - G.t / 170) * (G.t >= FRENZY ? 0.72 : 1) * Math.max(0.45, 1 - endless() * 0.06); // 170: the waits shrink gently
  const PATTERNS = {
    line: { from: 0, first: 0.8, every: () => rnd(2.6, 3.4) * pace(), spawn: spawnLine },
    draw: { from: 8, first: 0.8, every: () => rnd(3.6, 4.6) * pace(), spawn: () => spawnSlash(false) },
    burst: { from: 88, first: 0.6, every: () => rnd(5.5, 7) * pace(), spawn: spawnBurst },
    homing: { from: 48, first: 0.6, every: () => rnd(4.5, 6) * pace(), spawn: spawnHoming },
    cross: { from: 72, first: 2.5, every: () => rnd(6, 8) * pace(), spawn: () => spawnSlash(true) },
  };
  /** The big moves: each one shows itself when its 段 opens, then they take turns, the edges darkening and a drum before each. */
  const BIG = [
    { from: 16, key: "spikes", run: bigSpikes },
    { from: 32, key: "clones", run: bigClones },
    { from: 40, key: "spiral", run: bigSpiral },
    { from: 56, key: "ring", run: bigRing, name: ["天羅地網", "천라지망"] },
    { from: 64, key: "rain", run: bigRain },
    { from: 72, key: "triple", run: bigTriple },
    { from: 80, key: "beam", run: bigBeam },
    { from: 24, key: "palm", run: bigPalm, name: ["掌風", "장풍"] }, // opens 四段
    { from: 36, key: "flick", run: bigFlick, name: ["彈指神通", "탄지신통"] },
    { from: 52, key: "roar", run: bigRoar, name: ["獅子吼", "사자후"] },
    { from: 68, key: "silk", run: bigSilk, name: ["天蠶絲", "천잠사"] },
    { from: 84, key: "mist", run: bigMist, name: ["毒霧", "독무"] },
  ];
  function runBig(b) { G.lastBig = b.key; G.bigSeen.add(b.key); b.run(); G.dark = 1; sfx.taiko(); if (b.name) callout(...b.name); }
  // a technique's name, called out as it is used: great hanja, its reading beneath
  function callout(h, k) { G.callout = { h, k, at: performance.now() }; }

  // a point on the edge of the screen, just outside
  function edgePoint() {
    const m = S * 0.06, side = Math.floor(Math.random() * 4);
    if (side === 0) return [rnd(0, W), -m];
    if (side === 1) return [W + m, rnd(0, H)];
    if (side === 2) return [rnd(0, W), H + m];
    return [-m, rnd(0, H)];
  }
  // a spot well away from you, not too far off the middle
  function awayPoint(margin) {
    let best = [W / 2, H / 2], score = -Infinity;
    for (let i = 0; i < 14; i++) {
      const x = rnd(margin, W - margin), y = rnd(margin, H - margin);
      const s = Math.min(Math.hypot(x - P.x, y - P.y), S * 0.45) - Math.hypot(x - W / 2, y - H / 2) * 0.15;
      if (s > score) { score = s; best = [x, y]; }
    }
    return best;
  }
  function shoot(kind, x, y, ang, speed, extra = {}) {
    const f = 1 + Math.min(1.2, endless() * 0.07); // the endless 段 throw harder
    const s = Object.assign({ kind, x, y, vx: Math.cos(ang) * speed * f, vy: Math.sin(ang) * speed * f, rot: ang, spin: 0, len: 0, r: S * 0.012, best: Infinity, near: false, age: 0, bounces: 0, home: 0, hold: 0, go: 0 }, extra);
    s.go *= f;
    G.shots.push(s);
    return s;
  }

  // 죽림 수련's bamboo spears: no warning, that is the old game — read them as they come
  function spawnBamboo() {
    const [x, y] = edgePoint();
    const aim = Math.atan2(P.y - y, P.x - x) + rnd(-0.45, 0.45) * (Math.random() < 0.6 ? 1 : 2.2);
    shoot("bamboo", x, y, aim, S * rnd(0.42, 0.62) * (1 + G.t / 160), { len: S * rnd(0.08, 0.12), r: S * 0.006 });
    if (Math.random() < 0.25) sfx.whoosh();
  }
  function spawnLine() {
    const n = G.t >= 90 ? 3 : G.t >= 45 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const [x, y] = edgePoint(), [tx, ty] = aimPoint();
      const ang = Math.atan2(ty - y + rnd(-S * 0.12, S * 0.12) * i, tx - x + rnd(-S * 0.12, S * 0.12) * i);
      G.warns.push({ kind: "line", x, y, ang, t: 0, dur: 0.85 - Math.min(0.25, G.t / 400), delay: i * 0.18, fire() {
        for (let k = 0; k < 3; k++) setTimeout(() => G.mode === "play" && shoot("star", x, y, ang, S * 1.55, { spin: 18, r: S * 0.016 }), k * 70);
        sfx.whoosh();
      } });
    }
    sfx.warn();
  }
  function spawnSlash(cross) {
    const angs = cross ? [Math.PI / 4, -Math.PI / 4] : [[0, Math.PI / 2, Math.PI / 4, -Math.PI / 4][Math.floor(Math.random() * 4)]];
    const [tx, ty] = aimPoint(), x = tx + rnd(-S * 0.05, S * 0.05), y = ty + rnd(-S * 0.05, S * 0.05);
    for (const ang of angs) G.warns.push({ kind: "band", x, y, ang, w: S * 0.075, t: 0, dur: 0.95 - Math.min(0.25, G.t / 400), delay: 0, fire(w) { landCut(w); } });
    sfx.warn();
  }
  // kunai burst out of a point in every direction: each of their lines is drawn first, so you stand between them
  function spawnBurst() {
    const [tx, ty] = aimPoint();
    const x = clamp(tx + rnd(-S * 0.22, S * 0.22), edge(), W - edge()), y = clamp(ty + rnd(-S * 0.22, S * 0.22), edge(), H - edge());
    burstAt(x, y, G.t >= 90 ? 16 : 12, Math.random() * Math.PI, 1.0, false);
    sfx.warn();
  }
  function burstAt(x, y, n, off, dur, follow, skin) {
    G.warns.push({ kind: "ring", x, y, n, off, follow, t: 0, dur, delay: 0, fire: () => {
      for (let i = 0; i < n; i++) shoot("kunai", x, y, off + (i / n) * Math.PI * 2, S * 0.5, { r: S * 0.01, skin });
      sfx.burst(); G.shake = Math.max(G.shake, 8); burstInk(x, y, 14); stain(x, y, S * 0.05); flash("200,50,31", 0.12);
      // 아수라's follow-up: a second burst at once, turned half a step, into the gaps you were standing in
      if (hard() && !follow && Math.random() < HARD.follow) { burstAt(x, y, n, off + Math.PI / n, 0.45, true); sfx.warn(); }
    } });
  }
  function spawnHoming() {
    const [x, y] = edgePoint();
    G.warns.push({ kind: "spot", x: clamp(x, 8, W - 8), y: clamp(y, 8, H - 8), t: 0, dur: 0.55, delay: 0, fire: () => {
      shoot("kunai", x, y, Math.atan2(P.y - y, P.x - x), S * 0.58, { home: 1.6, r: S * 0.011, red: true });
      sfx.whoosh();
    } });
  }
  // a wall of bamboo (or a wave of water blades) with one gap
  function spawnWall(forceSide, kind = "bamboo") {
    const side = forceSide ?? Math.floor(Math.random() * 4); // 0 from top, 1 from right, 2 from bottom, 3 from left
    const across = side % 2 === 0 ? W : H;
    const gap = S * 0.2, gapAt = rnd(gap, across - gap);
    G.warns.push({ kind: "wall", side, gapAt, gap, t: 0, dur: 1.1, delay: 0, fire: () => {
      const step = S * 0.05, speed = S * 0.36, o = { len: S * 0.1, r: S * 0.006, wall: true };
      for (let p = step / 2; p < across; p += step) {
        if (Math.abs(p - gapAt) < gap / 2) continue;
        const m = S * 0.06;
        if (side === 0) shoot(kind, p, -m, Math.PI / 2, speed, o);
        if (side === 2) shoot(kind, p, H + m, -Math.PI / 2, speed, o);
        if (side === 3) shoot(kind, -m, p, 0, speed, o);
        if (side === 1) shoot(kind, W + m, p, Math.PI, speed, o);
      }
      sfx.whoosh();
    } });
    sfx.warn();
  }

  // ---- 죽순 함정: eruptions chase your steps, and a few more burst around
  function bigSpikes(skin) {
    const R = S * 0.075, n = 4 + Math.min(4, Math.floor(G.t / 45));
    for (let i = 0; i < n; i++) {
      G.warns.push({ kind: "spike", x: 0, y: 0, r: R, seed: rnd(0, 6), t: 0, dur: 0.7, delay: i * 0.34,
        place(w) { w.x = clamp(P.x, R, W - R); w.y = clamp(P.y, R, H - R); }, fire(w) { spikeErupt(w.x, w.y, w.r, skin); } });
    }
    for (let i = 0; i < 3 + Math.floor(n / 2); i++) {
      G.warns.push({ kind: "spike", x: rnd(R, W - R), y: rnd(R, H - R), r: R * rnd(0.9, 1.3), seed: rnd(0, 6), t: 0, dur: 0.9, delay: rnd(0, n * 0.34), fire(w) { spikeErupt(w.x, w.y, w.r, skin); } });
    }
  }
  function spikeErupt(x, y, r, skin = theme.spike) {
    G.hazards.push({ kind: "spike", skin, x, y, r, seed: rnd(0, 6), t: 0, dur: 0.55, best: Infinity, near: false,
      dist() { return this.t < 0.28 ? Math.max(0, Math.hypot(P.x - this.x, P.y - this.y) - this.r) : Infinity; },
      draw: drawSpike });
    G.shake = Math.max(G.shake, 6); sfx.thud(); stain(x, y, r * 0.8);
    for (let i = 0; i < 10; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(0.3, 0.8) * S;
      G.parts.push({ kind: "chip", x: x + Math.cos(a) * r * 0.5, y: y + Math.sin(a) * r * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.5, 3), life: rnd(0.3, 0.6), t: 0 });
    }
  }

  // ---- 분신 돌격: shadows step out of the grove and rush straight through where you stood
  function bigClones() {
    const n = G.t >= FRENZY ? 3 : 2;
    for (let i = 0; i < n; i++) G.warns.push({ kind: "clone", x: 0, y: 0, ang: 0, t: 0, dur: 0.8, delay: i * 0.6, place: placeClone, fire(w) { cloneDash(w.x, w.y, w.ang); } });
  }
  function placeClone(w) {
    const [x, y] = edgePoint(), m = S * 0.05, [tx, ty] = aimPoint();
    w.x = clamp(x, m, W - m); w.y = clamp(y, m, H - m);
    w.ang = Math.atan2(ty - w.y, tx - w.x);
    sfx.warn();
  }
  function cloneDash(x0, y0, ang, look) {
    const L = Math.hypot(W, H) * 1.2, speed = S * 3.2;
    G.hazards.push({ kind: "clone", look, x0, y0, ang, ux: Math.cos(ang), uy: Math.sin(ang), L, speed, tail: S * 0.3, w: S * 0.024, t: 0, dur: L / speed + 0.5, best: Infinity, near: false, dropAt: 0,
      head() { return Math.min(this.L, this.t * this.speed); },
      headPos() { const h = this.head(); return [this.x0 + this.ux * h, this.y0 + this.uy * h]; },
      step() {
        const h = this.head();
        if (h >= this.L || h < this.dropAt) return;
        this.dropAt = h + S * 0.12;
        const [x, y] = this.headPos();
        if (x < 0 || x > W || y < 0 || y > H) return;
        stain(x, y, S * 0.02);
        for (let i = 0; i < 3; i++) G.parts.push({ kind: "ink", x, y, vx: rnd(-1, 1) * S * 0.2, vy: rnd(-1, 1) * S * 0.2, r: rnd(1, 3), life: 0.4, t: 0 });
      },
      dist() {
        const h = this.head(); if (h >= this.L) return Infinity;
        const a = Math.max(0, h - this.tail), px = P.x - this.x0, py = P.y - this.y0, along = clamp(px * this.ux + py * this.uy, a, h);
        return Math.max(0, Math.hypot(px - this.ux * along, py - this.uy * along) - this.w / 2);
      },
      draw: drawClone });
    sfx.rush(); G.shake = Math.max(G.shake, 5);
  }

  // ---- 회오리 표창: a vortex throws stars along spinning arms
  function bigSpiral() { const [x, y] = awayPoint(S * 0.15); spiralAt(x, y); }
  function spiralAt(x, y, skin) {
    const dir = Math.random() < 0.5 ? 1 : -1, arms = G.t >= FRENZY ? 4 : 3, base = rnd(0, Math.PI * 2);
    G.warns.push({ kind: "spiral", x, y, dir, arms, base, t: 0, dur: 0.9, delay: 0, fire(w) {
      G.hazards.push({ kind: "spiral", skin, x: w.x, y: w.y, dir: w.dir, arms: w.arms, base: w.base, t: 0, dur: 2.6, acc: 0, best: Infinity, near: true,
        step(dt) {
          if (this.t > 2.3) return;
          this.acc += dt;
          while (this.acc >= 0.2) { // a star along each arm every 0.2 s; big enough to see coming
            this.acc -= 0.2;
            for (let k = 0; k < this.arms; k++) shoot("star", this.x, this.y, this.base + this.dir * this.t * 2.4 + (k / this.arms) * Math.PI * 2, S * 0.4, { spin: 16 * this.dir, r: S * 0.019, skin: this.skin });
            sfx.tick();
          }
        },
        dist() { return Math.max(0, Math.hypot(P.x - this.x, P.y - this.y) - S * 0.03); },
        draw: drawSpiralCore });
      sfx.burst(); G.shake = Math.max(G.shake, 6); stain(w.x, w.y, S * 0.05);
    } });
    sfx.warn();
  }

  // ---- 포위진: kunai ring you in, tremble, then close; one side is left open
  function bigRing(skin) {
    const n = 18, gapN = 2, R = S * 0.34, x = P.x, y = P.y, hold = 1.05;
    const gapAt = Math.floor(Math.random() * n);
    for (let i = 0; i < n; i++) {
      if ((i - gapAt + n) % n < gapN) continue;
      const a = (i / n) * Math.PI * 2, kx = x + Math.cos(a) * R, ky = y + Math.sin(a) * R;
      shoot("kunai", kx, ky, a + Math.PI, 0, { r: S * 0.01, hold, go: S * 0.62, red: true, skin });
      G.parts.push({ kind: "ink", x: kx, y: ky, vx: 0, vy: 0, r: S * 0.012, life: 0.35, t: 0 });
    }
    const gapA = ((gapAt + (gapN - 1) / 2) / n) * Math.PI * 2, gapW = ((gapN + 1) / n) * Math.PI * 2;
    G.warns.push({ kind: "circle", x, y, r: R, gapA, gapW, t: 0, dur: hold, delay: 0, fire() { sfx.whoosh(); sfx.clang(); } });
    sfx.warn();
  }

  // ---- 검우: swords rain in, each one's lane lit a moment before
  function bigRain() {
    const side = Math.random() < 0.6 ? 0 : 1 + Math.floor(Math.random() * 3);
    const n = Math.round(16 + Math.min(14, G.t / 10)), span = 2.4;
    for (let i = 0; i < n; i++) G.warns.push({ kind: "drop", side, p: 0, t: 0, dur: 0.55, delay: (i / n) * span + rnd(0, 0.05), place: placeDrop, fire(w) { fireDrop(w); } });
  }
  function placeDrop(w) {
    const [tx, ty] = aimPoint(), across = w.side % 2 === 0 ? W : H, me = w.side % 2 === 0 ? tx : ty, m = S * 0.02;
    w.p = Math.random() < 0.5 ? clamp(me + rnd(-S * 0.14, S * 0.14), m, across - m) : rnd(m, across - m);
  }
  function dropPath(w) { // [x0, y0, x1, y1, ang]: from the edge it comes in to the far one
    if (w.side === 0) return [w.p, 0, w.p, H, Math.PI / 2];
    if (w.side === 2) return [w.p, H, w.p, 0, -Math.PI / 2];
    if (w.side === 3) return [0, w.p, W, w.p, 0];
    return [W, w.p, 0, w.p, Math.PI];
  }
  function fireDrop(w) {
    const [x0, y0, , , ang] = dropPath(w), m = S * 0.12;
    shoot("sword", x0 - Math.cos(ang) * m, y0 - Math.sin(ang) * m, ang, S * 2.1, { len: S * 0.15, r: S * 0.007, ice: theme.rain === "icicle", skin: w.skin });
    if (Math.random() < 0.4) sfx.shing();
  }

  // ---- 삼연참: three cuts, one after another, each aimed where you are by then
  function bigTriple() {
    const angs = [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4].sort(() => Math.random() - 0.5);
    for (let i = 0; i < 3; i++) G.warns.push({ kind: "band", x: 0, y: 0, ang: angs[i], w: S * 0.075, t: 0, dur: 0.6, delay: i * 0.45,
      place(w) { w.x = P.x + rnd(-S * 0.03, S * 0.03); w.y = P.y + rnd(-S * 0.03, S * 0.03); sfx.warn(); }, fire(w) { landCut(w); } });
  }

  // ---- 회전 검기: a blade of light sweeps round a hub; the part it never reaches is shown first
  function bigBeam() { const [x, y] = awayPoint(S * 0.18); beamAt(x, y); }
  function beamAt(x, y, skin) {
    const toMe = Math.atan2(P.y - y, P.x - x), dir = Math.random() < 0.5 ? 1 : -1;
    const sweep = (Math.PI * 4) / 3, a0 = toMe + Math.PI, dur = 3.6;
    G.warns.push({ kind: "beam", x, y, a0, dir, sweep, t: 0, dur: 1.0, delay: 0, fire(w) {
      G.hazards.push({ kind: "beam", skin, x: w.x, y: w.y, a0: w.a0, dir: w.dir, sweep: w.sweep, w: S * 0.03, t: 0, dur, best: Infinity, near: false,
        angle() { return this.a0 + this.dir * this.sweep * Math.min(1, this.t / this.dur); },
        step(dt) {
          if (Math.random() > dt * 30) return;
          const a = this.angle(), d = rnd(S * 0.1, Math.hypot(W, H)), sx = this.x + Math.cos(a) * d, sy = this.y + Math.sin(a) * d;
          if (sx > 0 && sx < W && sy > 0 && sy < H) spark(sx, sy, 2);
        },
        dist() {
          if (this.t > this.dur - 0.2) return Infinity;
          const a = this.angle(), ux = Math.cos(a), uy = Math.sin(a), px = P.x - this.x, py = P.y - this.y, along = px * ux + py * uy;
          return Math.max(0, (along < 0 ? Math.hypot(px, py) : Math.abs(px * uy - py * ux)) - this.w / 2);
        },
        draw: drawBeam });
      sfx.slash(); sfx.hum(); G.shake = Math.max(G.shake, 8); flash("200,50,31", 0.15);
    } });
    sfx.warn();
  }

  // ---- 장풍: a great palm of qi sweeps across from one side; whoever it catches is thrown along with it
  function laneFrame(side, c) { // [x, y, ang, length] of a lane crossing the screen: 0 from the left, 1 from the top, 2 from the right, 3 from below
    return [[0, c, 0, W], [c, 0, Math.PI / 2, H], [W, c, Math.PI, W], [c, H, -Math.PI / 2, H]][side];
  }
  function bigPalm() {
    const side = Math.floor(Math.random() * 4), c = (side % 2 === 0 ? P.y : P.x) + rnd(-S * 0.08, S * 0.08), hw = S * 0.2;
    G.warns.push({ kind: "palm", side, c, hw, t: 0, dur: 0.9, delay: 0, fire(w) {
      const [ox, oy, ang, L] = laneFrame(w.side, w.c), speed = S * 1.5;
      G.hazards.push({ kind: "palm", ox, oy, ang, L, hw: w.hw, pos: -S * 0.3, t: 0, dur: (L + S * 0.6) / speed, hit: false, best: Infinity, near: true,
        step(dt) {
          this.pos += speed * dt;
          if (this.hit || P.inv > 0 || G.mode !== "play") return;
          const dx = P.x - this.ox, dy = P.y - this.oy, al = dx * Math.cos(this.ang) + dy * Math.sin(this.ang), ac = -dx * Math.sin(this.ang) + dy * Math.cos(this.ang);
          if (Math.abs(al - this.pos) < S * 0.17 && Math.abs(ac) < this.hw) { // caught: thrown the way it goes
            this.hit = true;
            P.push = { vx: Math.cos(this.ang) * S * 1.8, vy: Math.sin(this.ang) * S * 1.8, t: 0.32 };
            G.shake = Math.max(G.shake, 10); burstInk(P.x, P.y, 12); sfx.thud(); buzz(30);
          }
        },
        dist() { return Infinity; }, // it throws, it doesn't cut
        draw: drawPalm });
      sfx.palm();
    } });
    sfx.warn();
  }

  // ---- 탄지신통: qi flicked from a fingertip — small and very fast, the aim line only a blink ahead
  function bigFlick() {
    const n = 5 + Math.min(4, Math.floor(G.t / 40));
    for (let i = 0; i < n; i++) G.warns.push({ kind: "line", x: 0, y: 0, ang: 0, t: 0, dur: 0.38, delay: i * 0.2,
      place(w) { const [x, y] = edgePoint(); w.x = x; w.y = y; w.ang = Math.atan2(P.y - y, P.x - x); },
      fire(w) { shoot("pellet", w.x, w.y, w.ang, S * 2.3, { r: S * 0.009 }); sfx.tick(); } });
  }

  // ---- 사자후: a roar that shakes the ground — three rings of force spread out, each with one gap to slip through
  function bigRoar() { const [x, y] = awayPoint(S * 0.2); roarAt(x, y); }
  function roarAt(x, y) {
    const rings = [0, 0.5, 1.0].map((delay) => ({ delay, gapA: rnd(0, Math.PI * 2), gapW: 0.95 }));
    G.warns.push({ kind: "roar", x, y, rings, t: 0, dur: 0.8, delay: 0, fire(w) {
      const v = S * 0.75;
      G.hazards.push({ kind: "roar", x: w.x, y: w.y, rings: w.rings, v, th: S * 0.035, t: 0, dur: 1.0 + Math.hypot(W, H) / v, best: Infinity, near: false,
        dist() {
          const dx = P.x - this.x, dy = P.y - this.y, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
          let m = Infinity;
          for (const r of this.rings) {
            const rad = (this.t - r.delay) * this.v;
            if (rad <= 0) continue;

  const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);

  // ------------------------------------------------------------------ the loop
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused) { last = now; return; } // held by the store app (sent to the background): the picture stays as it was
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    G.flash = Math.max(0, G.flash - dt * 2.2);
    G.zoom *= Math.pow(0.002, dt);
    G.dark = Math.max(0, G.dark - dt * 1.3);
    paperFade = Math.max(0, paperFade - dt * 0.8);
    const cine = G.story && G.mode === "play" && CUT_PHASES.includes(G.phase) ? 1 : 0; // the black bars of a scene
    G.cine += (cine - G.cine) * Math.min(1, dt * 6);
    if (G.stopT > 0) { G.stopT -= dt; draw(now / 1000); return; } // hit-stop: the world holds its breath
    if (G.slowT > 0) { G.slowT -= dt; if (G.slowT <= 0) G.slow = 1; }
    const sdt = dt * G.slow;
    if (G.mode === "play") step(sdt, dt);
    else if (G.mode === "dying") { G.dieT += dt; stepWorld(sdt * 0.25); if (G.dieT > 1.1) over(); }
    else stepWorld(sdt); // the title and result screens: the grove keeps moving behind
    stepAmbient(dt);
    draw(now / 1000);
  }

  function step(dt, realDt) {
    // the player
    let kx = 0, ky = 0;
    if (keys.has("arrowleft") || keys.has("a")) kx--;
    if (keys.has("arrowright") || keys.has("d")) kx++;
    if (keys.has("arrowup") || keys.has("w")) ky--;
    if (keys.has("arrowdown") || keys.has("s")) ky++;
    const wade = inMist() ? MIST_SLOW : 1; // 독무 slows you
    if (kx || ky) { const d = Math.hypot(kx, ky); P.x += (kx / d) * SPEED() * wade * dt; P.y += (ky / d) * SPEED() * wade * dt; P.dx = kx / d; P.dy = ky / d; }
    if (P.push) { // thrown by 장풍
      P.x += P.push.vx * realDt; P.y += P.push.vy * realDt; P.push.t -= realDt;
      if (P.push.t <= 0) P.push = null;
    }
    if (wade < 1 && Math.random() < realDt * 8) G.parts.push({ kind: "glow", color: "#8fbf6a", x: P.x + rnd(-8, 8), y: P.y + rnd(-6, 6), vx: 0, vy: -rnd(15, 35), r: rnd(1.5, 3), life: 0.6, t: 0 });
    P.x = clamp(P.x, edge(), W - edge()); P.y = clamp(P.y, edge(), H - edge());
    P.inv = Math.max(0, P.inv - realDt);
    if (G.story) storyStep(dt, realDt); else endlessStep(dt);
    if (G.mode !== "play") return; // a boss's body can end it
    stepWorld(dt);
    if (G.comboT > 0) { G.comboT -= realDt; if (G.comboT <= 0) G.combo = 0; }
  }

  // 무한 수련: a new 段 every so often, each bringing something, the big moves taking turns
  function endlessStep(dt) {
    if (G.kind === "mon") return monStep(dt);
    const adt = dt / EASE; // the attacks' own clock, a little slow: the 段 still turn on the real one
    G.rt += dt;
    G.t += dt * (hard() ? HARD.clock : 1);
    const rare = G.kind === "normal" ? RARE : 1;
    const st = stageIndex(G.t);
    if (st !== G.stage) {
      G.stage = st; showBanner(stageInfo(st)); sfx.stage();
      const b = BIG.find((x) => x.from === STAGES[st]?.at);
      if (b) { runBig(b); G.bigT = rnd(5.5, 7) * rare; }
    }
    if (G.kind !== "red") { // the bamboo never stops
      G.timers.bamboo -= adt;
      if (G.timers.bamboo <= 0) { spawnBamboo(); G.timers.bamboo = (hard() ? 0.4 : 0.5) * pace(); }
    }
    // the steady attacks (in 아수라 some come twice at once, the second somewhere else)
    for (const [k, p] of Object.entries(PATTERNS)) {
      if (G.t < p.from || (p.only && !p.only.includes(G.kind))) continue;
      G.timers[k] -= adt;
      if (G.timers[k] <= 0) { p.spawn(); if (hard() && Math.random() < HARD.twice) p.spawn(); G.timers[k] = p.every() * rare; }
    }
    // the big moves take turns; in 광란 two can come at once
    if (G.t >= BIG[0].from) {
      G.bigT -= adt;
      if (G.bigT <= 0) {
        const open = BIG.filter((b) => b.from <= G.t), fresh = open.find((b) => !G.bigSeen.has(b.key)); // a newly opened one comes first
        const pool = open.length > 1 ? open.filter((b) => b.key !== G.lastBig) : open;
        const b = fresh || pool[Math.floor(Math.random() * pool.length)];
        runBig(b);
        if (G.t >= FRENZY && pool.length > 1 && Math.random() < 0.3 + Math.min(0.4, endless() * 0.05)) {
          const others = pool.filter((x) => x !== b);
          runBig(others[Math.floor(Math.random() * others.length)]);
        }
        G.bigT = rnd(6, 8.5) * clamp(pace() * 1.4, 0.6, 1) * rare;
      }
    }
  }

  function stepWorld(dt) {
    const hit = HIT(), near = NEAR(), inv = P.inv > 0 || G.safe;
    // warnings run out and fire; some pick their spot only when their turn comes.
    // They fire after the list is rebuilt, so a warning a firing one raises (아수라's follow-ups) is kept.
    const due = [];
    G.warns = G.warns.filter((w) => {
      if (w.delay > 0) { w.delay -= dt; return true; }
      if (w.place && !w.placed) { w.placed = true; w.place(w); }
      w.t += dt * (hard() ? HARD.warn : 1); // 아수라 gives you less time to read them
      if (w.t >= w.dur) { due.push(w); return false; }
      return true;
    });
    if (G.mode === "play") for (const w of due) w.fire(w);
    // flying things
    for (const s of G.shots) {
      if (s.dead) continue;
      s.age += dt;
      if (s.hold > 0) { // waiting in the air, then away
        s.hold -= dt;
        if (s.hold <= 0) { s.vx = Math.cos(s.rot) * s.go; s.vy = Math.sin(s.rot) * s.go; }
      } else {
        if (s.home > 0) {
          s.home -= dt;
          const want = Math.atan2(P.y - s.y, P.x - s.x), cur = Math.atan2(s.vy, s.vx);
          let d = want - cur; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
          const turn = clamp(d, -2.3 * dt, 2.3 * dt), sp = Math.hypot(s.vx, s.vy);
          s.vx = Math.cos(cur + turn) * sp; s.vy = Math.sin(cur + turn) * sp;
        }
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.rot = s.spin ? s.rot + s.spin * dt : Math.atan2(s.vy, s.vx);
        if (s.bounces > 0) {
          if ((s.x < s.r && s.vx < 0) || (s.x > W - s.r && s.vx > 0)) { s.vx *= -1; s.bounces--; spark(s.x, s.y); sfx.clang(); }
          if ((s.y < s.r && s.vy < 0) || (s.y > H - s.r && s.vy > 0)) { s.vy *= -1; s.bounces--; spark(s.x, s.y); sfx.clang(); }
        }
      }
      if (G.mode !== "play") continue;
      const d = distToShot(s);
      if (d < hit + s.r * 0.6 && !inv) return die(s.x, s.y);
      if (d < s.best) s.best = d;
      else if (!s.near && s.best < near + s.r && s.best >= hit) { s.near = true; nearMiss(s.x, s.y); }
    }
    const m = S * 0.25;
    G.shots = G.shots.filter((s) => !s.dead && (s.hold > 0 || (s.age < 12 && s.x > -m && s.x < W + m && s.y > -m && s.y < H + m)));
    // things on the ground: spikes, rushing shadows, the vortex, the sweeping blade
    for (const h of G.hazards) {
      h.t += dt;
      if (h.step) h.step(dt);
      if (G.mode !== "play") continue;
      const d = h.dist();
      if (d < hit && !inv) return die(P.x, P.y);
      if (d < h.best) h.best = d;
      else if (!h.near && h.best < near && h.best >= hit) { h.near = true; nearMiss(h.x ?? h.x0, h.y ?? h.y0); }
    }
    G.hazards = G.hazards.filter((h) => h.t < h.dur);
    // a slash lands (one that waits has t < 0; a boss's felling strokes harm nobody)
    G.cuts = G.cuts.filter((c) => {
      c.t += dt;
      if (c.t < 0) return true;
      if (!c.checked && G.mode === "play") {
        c.checked = true;
        const d = distToLine(P.x, P.y, c.x, c.y, c.ang);
        if (d < c.w / 2 + hit * 0.5 && !inv) { die(P.x, P.y); return true; }
        if (d < c.w / 2 + near) { // the nearest point of the stroke's line, so the body is thrown off it
          const sd = (P.x - c.x) * Math.sin(c.ang) - (P.y - c.y) * Math.cos(c.ang);
          nearMiss(P.x - sd * Math.sin(c.ang), P.y + sd * Math.cos(c.ang));
        }
      }
      return c.t < 0.45;
    });
    for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; if (p.spin) p.rot += p.spin * dt; }
    G.parts = G.parts.filter((p) => p.t < p.life);
    for (const x of G.texts) x.t += dt;
    G.texts = G.texts.filter((x) => x.t < 0.9);
    for (const d of G.decals) d.t += dt;
    G.decals = G.decals.filter((d) => d.t < d.life);
    G.shake *= Math.pow(0.02, dt);
  }

  // what drifts through each scene: bamboo leaves, mist, embers, snow, ash
  const DRIFT = { leaf: [16, 3], mist: [5, 0.5], ember: [18, 5], snow: [34, 9], ash: [16, 3], petal: [14, 2.5] }; // [how many at most, how many a second]
  function stepAmbient(dt) {
    const k = theme.drift, [cap, rate] = DRIFT[k];
    if (G.leaves.length < (reduced ? Math.min(6, cap) : cap) && Math.random() < dt * rate) {
      const l = { k, x: rnd(0, W), y: -10, vx: rnd(-12, 12), vy: rnd(18, 40), rot: rnd(0, 6), spin: rnd(-2, 2), s: rnd(5, 10), sway: rnd(0, 6), wob: 18 };
      if (k === "mist") Object.assign(l, { x: -S * 0.4, y: rnd(H * 0.1, H * 0.9), vx: rnd(10, 22), vy: 0, s: S * rnd(0.25, 0.45), wob: 0 });
      if (k === "ember") Object.assign(l, { y: H + 10, vy: -rnd(25, 55), vx: rnd(-8, 8), s: rnd(1.5, 3), wob: 14 });
      if (k === "snow") Object.assign(l, { vy: rnd(22, 50), s: rnd(1.5, 3.5), wob: 12 });
      if (k === "ash") Object.assign(l, { vy: rnd(14, 30), s: rnd(2, 4), wob: 10 });
      G.leaves.push(l);
    }
    for (const l of G.leaves) { l.sway += dt; l.x += (l.vx + Math.sin(l.sway * 1.6) * l.wob) * dt; l.y += l.vy * dt; l.rot += l.spin * dt; }
    G.leaves = G.leaves.filter((l) => l.y < H + 40 && l.y > -60 && l.x < W + S * 0.5);
  }
  function drawDrift(time) {
    for (const l of G.leaves) {
      if (l.k === "mist") {
        const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.s);
        g.addColorStop(0, "rgba(255,255,255,0.22)"); g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.fillRect(l.x - l.s, l.y - l.s, l.s * 2, l.s * 2);
      } else if (l.k === "ember" || l.k === "snow") {
        ctx.fillStyle = l.k === "snow" ? "rgba(255,255,255,0.95)" : `rgba(232,${Math.round(110 + Math.sin(time * 9 + l.sway) * 40)},40,0.85)`;
        ctx.beginPath(); ctx.arc(l.x, l.y, l.s, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = l.k === "ash" ? "rgba(70,25,22,0.5)" : l.k === "petal" ? "rgba(242,180,196,0.85)" : "rgba(70,90,50,0.45)";
        ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
        if (l.k === "ash") ctx.fillRect(-l.s, -l.s * 0.4, l.s * 2, l.s * 0.8);
        else { ctx.beginPath(); ctx.ellipse(0, 0, l.s, l.s * 0.28, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
    }
  }

  function distToShot(s) {
    if (!s.len) return Math.hypot(P.x - s.x, P.y - s.y);
    const ux = Math.cos(s.rot), uy = Math.sin(s.rot);
    const ax = s.x - ux * s.len, ay = s.y - uy * s.len; // the stick runs back from its tip
    const t = clamp(((P.x - ax) * ux + (P.y - ay) * uy) / s.len, 0, 1);
    return Math.hypot(P.x - (ax + ux * s.len * t), P.y - (ay + uy * s.len * t));
  }
  const distToLine = (px, py, x, y, ang) => Math.abs((px - x) * Math.sin(ang) - (py - y) * Math.cos(ang));

  function nearMiss(fx, fy) { // (fx, fy): where the thing that just missed was, if known
    G.combo++; G.comboT = 1.4; G.near++; G.maxCombo = Math.max(G.maxCombo || 0, G.combo);
    const add = 0.2 + Math.min(0.3, G.combo * 0.05);
    G.bonus += add;
    G.texts.push({ text: G.combo > 1 ? `간발 ×${G.combo}` : "간발!", x: P.x, y: P.y - S * 0.06, t: 0, add });
    sfx.ting();
    if (!reduced) { G.slow = 0.55; G.slowT = 0.09; }
    heroDodge(fx, fy);
    // a run of them is told by the words alone. No shake, flash or rings over the field: the next blade has to stay readable.
    if (G.combo >= 5 && G.combo % 5 === 0) { sfx.combo(); buzz([20, 30, 40]); }
    hurtBoss(0.025);
  }

  function die(x, y) {
    if (G.mode !== "play") return;
    G.mode = "dying"; G.dieT = 0; G.shake = reduced ? 0 : 22;
    burstInk(x, y, 40); stain(x, y, S * 0.08); sfx.death(); buzz([60, 40, 120]);
    flash("200,50,31", 0.45); G.zoom = 0.05; G.stopT = 0.08;
    drag = null;
  }

  // ---- the strokes that make it feel like a fight
  function landCut(w) {
    G.cuts.push({ x: w.x, y: w.y, ang: w.ang, w: w.w, t: 0, checked: false, tint: w.tint });
    // 아수라's follow-up: the blade comes straight back across the same spot
    if (hard() && !w.follow && Math.random() < HARD.follow) {
      G.warns.push({ kind: "band", x: w.x, y: w.y, ang: w.ang + (Math.random() < 0.5 ? Math.PI / 2 : Math.PI / 4), w: w.w, t: 0, dur: 0.42, delay: 0.05, follow: true, fire(v) { landCut(v); } });
      sfx.warn();
    }
    sfx.slash(); G.shake = Math.max(G.shake, 10); buzz(20); flash("255,250,235", 0.28);
    const ux = Math.cos(w.ang), uy = Math.sin(w.ang), D = Math.hypot(W, H);
    for (let i = 0; i < 22; i++) { // ink thrown off the blade's path
      const s = rnd(-D, D), x = w.x + ux * s, y = w.y + uy * s;
      if (x < 0 || x > W || y < 0 || y > H) continue;
      const side = Math.random() < 0.5 ? -1 : 1, sp = rnd(0.2, 0.7) * S;
      G.parts.push({ kind: "ink", x, y, vx: -uy * side * sp, vy: ux * side * sp, r: rnd(1.2, 3.5), life: rnd(0.3, 0.6), t: 0 });
    }
    G.decals.push({ line: true, x: w.x, y: w.y, ang: w.ang, w: Math.max(2, w.w * 0.1), t: 0, life: 2 });
  }
  function burstInk(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(0.1, 0.9) * S;
      G.parts.push({ kind: "ink", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.5, 5.5), life: rnd(0.4, 0.9), t: 0 });
    }
  }
  function spark(x, y, n = 6) {
    for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2); G.parts.push({ kind: "spark", x, y, vx: Math.cos(a) * S * 0.5, vy: Math.sin(a) * S * 0.5, r: 1.6, life: 0.25, t: 0 }); }
  }
  function shatter(s) { // a blade cut in two, the halves spinning off
    const color = s.kind === "bamboo" ? "#6f8a4a" : s.kind === "sword" ? "#b9bcbe" : "#2a2725";
    const len = (s.len || s.r * 2.6) * 0.5, nx = -Math.sin(s.rot), ny = Math.cos(s.rot);
    for (const side of [-1, 1]) G.parts.push({ kind: "half", x: s.x, y: s.y, vx: nx * side * S * 0.35 + s.vx * 0.15, vy: ny * side * S * 0.35 + s.vy * 0.15, rot: s.rot, spin: side * rnd(6, 12), len, w: Math.max(3, S * 0.01), color, r: 0, life: 0.55, t: 0 });
    spark(s.x, s.y, 3);
  }
  function stain(x, y, r) { // ink that soaks into the paper and slowly dries
    const blobs = [{ dx: 0, dy: 0, r: r * 0.6 }];
    for (let i = 0; i < 5; i++) { const a = rnd(0, Math.PI * 2), d = rnd(0.4, 1.2) * r; blobs.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: rnd(0.1, 0.3) * r }); }
    G.decals.push({ x, y, blobs, t: 0, life: 5 });
    if (G.decals.length > 40) G.decals.shift();
  }
  function flash(rgb, a) { if (reduced) a *= 0.3; if (a >= G.flash) { G.flash = a; G.flashC = rgb; } }

  function showBanner(st) { G.banner = { st, t: performance.now() }; $("stage").textContent = st.name; }

  // ------------------------------------------------------------------ drawing
  function draw(time) {
    ctx.save();
    if (G.shake > 0.5) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
    if (G.zoom > 0.002) { ctx.translate(W / 2, H / 2); ctx.scale(1 + G.zoom, 1 + G.zoom); ctx.translate(-W / 2, -H / 2); }
    ctx.drawImage(paper, 0, 0, W, H);
    if (paperFade > 0 && paperOld) { ctx.globalAlpha = paperFade; ctx.drawImage(paperOld, 0, 0, W, H); ctx.globalAlpha = 1; } // the old scene dissolving
    drawDecals();
    drawDrift(time);
    for (const w of G.warns) drawWarn(w, time);
    for (const h of G.hazards) h.draw(h, time);
    drawMons(time);
    drawBoss(time);
    for (const s of G.shots) drawShot(s);
    for (const c of G.cuts) drawCut(c);
    if (G.mode === "play" || G.mode === "dying" || G.mode === "menu") drawPlayer(time);
    for (const p of G.parts) {
      const a = 1 - p.t / p.life;
      if (p.kind === "half") {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a;
        ctx.fillStyle = p.color; ctx.fillRect(-p.len / 2, -p.w / 2, p.len, p.w);
        ctx.restore(); continue;
      }
      if (p.kind === "ring") { // a shockwave of ink spreading out
        const k = p.t / p.life;
        ctx.strokeStyle = hexA(p.color, 0.7 * a); ctx.lineWidth = 1 + 5 * a;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r + p.grow * k, (p.r + p.grow * k) * (p.round ? 1 : 0.35), 0, 0, Math.PI * 2); ctx.stroke(); // round in the air, flat on the ground
        continue;
      }
      if (p.kind === "glow") { ctx.fillStyle = hexA(p.color, 0.85 * a); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); continue; }
      ctx.fillStyle = p.kind === "spark" ? `rgba(200,50,31,${a})` : p.kind === "chip" ? `rgba(111,138,74,${a})` : `rgba(29,26,23,${a * 0.85})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.kind === "ink" ? 1 + p.t : 1), 0, Math.PI * 2); ctx.fill();
    }
    for (const x of G.texts) {
      const a = 1 - x.t / 0.9;
      ctx.globalAlpha = a;
      ctx.font = `${Math.round(S * 0.06)}px "Nanum Brush Script", cursive`;
      ctx.textAlign = "center"; ctx.fillStyle = "#c8321f";
      ctx.fillText(x.text, x.x, x.y - x.t * S * 0.08);
      ctx.font = `700 ${Math.round(S * 0.026)}px "Noto Serif KR", serif`;
      ctx.fillStyle = "#1d1a17";
      ctx.fillText(`+${x.add.toFixed(2)}초`, x.x, x.y - x.t * S * 0.08 + S * 0.034);
      ctx.globalAlpha = 1;
    }
    drawMood(time);
    drawBanner();
    drawCombo();
    drawCallout();
    if (G.mode === "dying") drawStamp(G.dieT);
    ctx.restore();
    if (G.flash > 0.01) { ctx.fillStyle = `rgba(${G.flashC},${G.flash})`; ctx.fillRect(0, 0, W, H); }
    if (G.story) { drawBossBar(); drawCine(time); drawCard(); }
    drawMsg();
  }

  // ---- 검객전 drawing: the boss, its bar, the black bars and lines, the chapter card
  const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
  // how big a boss stands (its unit; a figure is about four of these tall)
  const bossUnit = (def) => S * ({ twins: 0.04, lord: 0.062 })[def.look] || S * 0.05;
  function drawBoss(time) {
    const b = G.boss; if (!b) return;

  });

  document.addEventListener("visibilitychange", () => { if (!ac) return; if (document.hidden) ac.suspend(); else if (!muted && !paused) ac.resume(); });
  // ---- the handle a store wrapper holds (원스토어 now, 토스 later): its pause and resume, the phone's silent

  window.JUKLIM_GAME = {
    pause() { paused = true; if (ac && ac.state === "running") ac.suspend(); }, // safe to call twice
    resume() { paused = false; if (ac && !muted && !document.hidden) ac.resume(); },
    silent(on) { ringerSilent = !!on; if (master) master.gain.setTargetAtTime(muted || ringerSilent ? 0 : 1, ac.currentTime, 0.05); },
    back() { if (!$("shop").hidden) { $("shopClose").click(); return true; } return false; }, // the shop closes; anything else is the app's to answer

    setInsets(a) { const s = document.documentElement.style; for (const k of ["top", "right", "bottom", "left"]) s.setProperty(`--sa-${k}`, `${Math.max(0, Number(a?.[k]) || 0)}px`); },
  };

  // ------------------------------------------------------------------ ads and the shop, through the platform

  // inside the Toss bundle (it may arrive after this script runs, so it is looked up every time).
  // On the plain web there's neither: no ads, nothing to buy, and the buttons for them stay hidden or say so.
  const WEB_PLATFORM = { name: "web", showBreakAd: async () => false, rewardReady: () => false, showRewardAd: async () => false,
    products: async () => null, buy: async () => false, restore: async () => null };
  const platform = () => window.JUKLIM_PLATFORM || WEB_PLATFORM;

  // a break ad after every fifth run, on the way out of the result screen: never over a run, never over a score
  const AD_EVERY = 5;
  let runsSinceAd = Number(store.get("runsSinceAd", "0")) || 0, adBusy = false;
  function countRun() { runsSinceAd++; store.set("runsSinceAd", runsSinceAd); }
  function adSeen() { runsSinceAd = 0; store.set("runsSinceAd", 0); }
  // 광고 제거, bought once: the break ad never comes again. The ads a player chooses (carry on, double the 엽전) stay theirs to take.
  const NOADS = { sku: "juklim_noads", name: "광고 제거" };
  let noAds = store.get("noads", "0") === "1";
  function grantNoAds(on = true) { noAds = on; store.set("noads", on ? "1" : "0"); }
  async function adBreak(then) {

  }

  // 이어하기: once a run, for an ad watched to the end. Endless modes only; the story already gives a chapter back for free.
  // The run goes on only when the player taps again after the ad, because some Toss versions never say the ad has closed.
  function syncRevive() {
    const b = $("revive");
    b.hidden = (G.story && !G.stageRun) || G.revived || !platform().rewardReady(); // the story gives a chapter back for free; the stages don't

    if (!earned) return syncRevive();

  });
  function revive() {
    G.revived = true; G.mode = "play"; G.dieT = 0; G.shake = 0; G.stopT = 0;
    clearField(); G.mons = [];
    Object.assign(P, { inv: 2, push: null }); // two seconds to find your feet
    $("over").hidden = true; $("revive").hidden = true; $("hud").hidden = false;
    flash("255,250,235", 0.35); sfx.ready();
  }

  // ---- 상점: the swordsman's clothes
  const skuSkin = (sku) => Object.keys(HERO_SKINS).find((k) => HERO_SKINS[k].sku === sku);
  let prices = {}; // sku -> "2,200원", once the platform says what's on sale
  function grantSkin(id, on = true, fresh = false) {
    if (!HERO_SKINS[id] || id === "cheong") return;
    const had = owned.has(id);
    if (on) owned.add(id); else owned.delete(id);
    store.set("skins", [...owned].filter((k) => k !== "cheong").join(","));
    if (!on && SKIN === HERO_SKINS[id]) wear("cheong"); // refunded while wearing it
    if (on && !had && fresh) { store.set("skinNew", id); $("shopOpen").classList.add("has-new"); }
  }
  function wear(id) { if (!owned.has(id)) return; SKIN = HERO_SKINS[id]; store.set("skin", id); HERO.ghosts.length = 0; }
  async function syncShop() { // Toss's own records win: bought on another phone, or refunded
    try {
      const got = await platform().restore();
      if (got) for (const o of got) { const id = skuSkin(o.sku); if (id) grantSkin(id, !o.refunded); else if (o.sku === NOADS.sku) grantNoAds(!o.refunded); }
      const list = await platform().products();
      prices = {}; if (list) for (const p of list) prices[p.sku] = p.price;
    } catch { /* keep what we had */ }
    if (!$("shop").hidden) renderShop();
  }
  function drawSkinPreview(pv, sk) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), size = 72, r = size * 0.21;
    pv.width = size * dpr; pv.height = size * dpr;
    const c = pv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.translate(size / 2, size * 0.56);
    c.lineCap = "round"; c.strokeStyle = sk.band; c.lineWidth = r * 0.16; // the headband's tails, hanging still
    for (const [x1, y1, x2, y2] of [[-0.24, -0.34, -0.95, 0.55], [-0.38, -0.34, -1.12, 0.32]]) { c.beginPath(); c.moveTo(x1 * r, y1 * r); c.quadraticCurveTo((x1 - 0.5) * r, 0, x2 * r, y2 * r); c.stroke(); }
    heroFigure(c, r, sk, 1, 0, 0.3, 1, 0);
  }
  function renderShop() {

      const name = document.createElement("b"); name.textContent = NOADS.name;
      const what = document.createElement("small"); what.textContent = "다섯 판마다 나오는 광고가 사라진다";

    for (const [id, sk] of Object.entries(HERO_SKINS)) {
      // inside Toss with nothing on sale (no business registered yet, so no in-app purchases): leave it out, don't tease it
      if (sk.sku && !owned.has(id) && !prices[sk.sku] && platform().name !== "web") continue;
      const card = document.createElement("div"); card.className = "skin" + (SKIN === sk ? " is-on" : "");
      const pv = document.createElement("canvas"); drawSkinPreview(pv, sk);
      const name = document.createElement("b"); name.textContent = sk.name;
      const b = document.createElement("button"); b.type = "button";
      if (SKIN === sk) { b.textContent = "입는 중"; b.disabled = true; }
      else if (owned.has(id)) { b.textContent = "입기"; b.addEventListener("click", () => { wear(id); renderShop(); }); }
      else if (sk.coin) { b.textContent = `엽전 ${fmt(sk.coin)}`; if (coins < sk.coin) b.disabled = true; else b.addEventListener("click", () => buyWithCoins(id)); }

  }
  async function buySkin(id, b) {
    const sk = HERO_SKINS[id];
    b.disabled = true; b.textContent = "결제 중";
    try { await platform().buy(sk.sku, () => { grantSkin(id); return true; }); } catch { /* told below */ }

  async function buyNoAds(b) {

  $("shopOpen").addEventListener("click", () => {
    $("start").hidden = true; $("shop").hidden = false;

  $("shopClose").addEventListener("click", () => { $("shop").hidden = true; $("start").hidden = false; });
  // beaten 설귀 before there was a shop: the clothes are waiting
  if ((Number(store.get("storyCh", "0")) || 0) >= 4 || (Number(store.get("storyClears", "0")) || 0) > 0) grantSkin("seol", true, true);
  if (store.get("skinNew", "")) $("shopOpen").classList.add("has-new");

  // ------------------------------------------------------------------ 엽전 and 오늘의 수련
  // 엽전 are earned by playing and spent on clothes, and they are only ever earned. Selling them for money would need
  // a server: a bought coin is used up, so Toss can't hand it back after a reinstall the way it does a bought skin.
  // Every number of the economy is in ECON, to tune in one place.
  const ECON = {
    perSecond: 1,   // for every second survived (a 30-second run with a few 간발 pays about 40)
    perNear: 2,     // for every 간발
    hard: 1.5,      // 하드모드 pays half again
    chapter: 30,    // each story chapter passed, and each boss stage of 스테이지 모드
    stage: 8,       // each other stage of 스테이지 모드
    daily: 30,      // the first visit of a day
    drill: 60,      // each of the day's three 수련
  };
  let coins = Number(store.get("coins", "0")) || 0;
  const fmt = (n) => Math.round(n).toLocaleString("ko-KR");
  function addCoins(n) { coins = Math.max(0, Math.round(coins + n)); store.set("coins", coins); $("coins").textContent = fmt(coins); $("shopCoins").textContent = fmt(coins); }

  // the day's three 수련. Everyone gets the same three, picked by the date, so friends can talk about them.
  // `add` ones count up across runs; the others take the best single run.
  const DRILLS = [
    { id: "runs", text: "세 판 하기", goal: 3, add: true },
    { id: "near", text: "한 판에 간발 10번", goal: 10, of: (r) => r.near },
    { id: "live", text: "한 판에 60초 버티기", goal: 60, of: (r) => r.time },
    { id: "combo", text: "간발 5연속", goal: 5, of: (r) => r.combo },
    { id: "red", text: "특수 효과만 30초", goal: 30, of: (r) => (r.kind === "red" ? r.time : 0) },
    { id: "hard", text: "하드모드 30초", goal: 30, of: (r) => (r.kind === "hard" ? r.time : 0) },
    { id: "stage", text: "스테이지 세 개 깨기", goal: 3, add: true },
  ];
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  function pickDrills(day) { // a small seeded shuffle of the pool
    let h = 2166136261;
    for (const ch of day) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    const pool = DRILLS.map((d) => d.id), out = [];
    while (out.length < 3) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); }
    return out;
  }
  let drill = (() => { try { return JSON.parse(store.get("drill", "null")); } catch { return null; } })();
  function drillDay() { // a new day: three new 수련, and the visit itself pays
    const day = today(), known = (i) => DRILLS.some((d) => d.id === i);
    if (drill && drill.day === day && Array.isArray(drill.ids)) {
      if (drill.ids.every(known)) return;
      // today's list names a 수련 that's gone (the story's): pick today's again, without paying the visit twice
      Object.assign(drill, { ids: pickDrills(day), prog: {}, done: {} });
      store.set("drill", JSON.stringify(drill)); renderDrills(); return;
    }
    drill = { day, ids: pickDrills(day), prog: {}, done: {} };
    store.set("drill", JSON.stringify(drill));
    addCoins(ECON.daily);
    $("drillNote").textContent = `오늘 처음 왔다. 엽전 +${ECON.daily}`; $("drillNote").hidden = false;
    renderDrills();
  }
  function drillProgress(id, value, add = false) { // returns the reward when this finishes it
    if (!drill || !drill.ids.includes(id) || drill.done[id]) return 0;
    const d = DRILLS.find((x) => x.id === id);
    drill.prog[id] = add ? (drill.prog[id] || 0) + value : Math.max(drill.prog[id] || 0, value);
    let got = 0;
    if (drill.prog[id] >= d.goal) { drill.done[id] = true; got = ECON.drill; addCoins(got); }
    store.set("drill", JSON.stringify(drill));
    renderDrills();
    return got;
  }
  function renderDrills() {
    const list = $("drillList"); list.replaceChildren();
    let n = 0;
    for (const id of drill.ids) {
      const d = DRILLS.find((x) => x.id === id), done = !!drill.done[id], p = Math.min(d.goal, Math.floor(drill.prog[id] || 0));
      if (done) n++;
      const li = document.createElement("li"); if (done) li.className = "is-done";
      const a = document.createElement("span"); a.textContent = d.text;
      const b = document.createElement("span"); b.textContent = done ? `+${ECON.drill}` : `${p} / ${d.goal}`;
      li.append(a, b); list.append(li);
    }

  }

  // a run begins: fresh counts for what it will earn (and the ad count goes on)
  function runStart() {
    Object.assign(G, { revived: false, maxCombo: 0, paidT: 0, paidN: 0, doubled: false, chapCoins: 0, lastPay: 0 });
    countRun(); drillDay(); drillProgress("runs", 1, true);
    $("drillNote").hidden = true;
  }
  // a run ends, or one stretch of it when it's carried on with an ad: pay only what wasn't paid already
  function payRun() {
    const story = G.story, time = story ? G.st : G.rt, near = G.near;
    const dt = Math.max(0, time - (G.paidT || 0)), dn = Math.max(0, near - (G.paidN || 0));
    G.paidT = time; G.paidN = near;
    const earned = Math.round((dt * ECON.perSecond + dn * ECON.perNear) * (!story && G.kind === "hard" ? ECON.hard : 1));
    const r = { kind: story ? "story" : G.kind, time, near, combo: G.maxCombo || 0 };
    let drills = 0;
    for (const d of DRILLS) if (d.of) drills += drillProgress(d.id, d.of(r));
    if (r.kind === "hard" && time >= 60) grantSkin("seol", true, true); // a minute in 하드모드 earns the 설산 clothes
    addCoins(earned);
    const chap = G.chapCoins || 0; G.chapCoins = 0;
    G.lastPay = earned;
    if (earned + drills + chap > 0) sfx.coin();
    return { earned, drills, chap };
  }
  function showGain(g) {

  }
  function renderGain() {
    const i = document.createElement("i"); i.className = "coin"; i.setAttribute("aria-hidden", "true");
    const t = document.createElement("span"); t.textContent = `엽전 +${fmt(G.gain)}` + (G.gainParts.length ? ` (${G.gainParts.join(", ")})` : "");
    $("coinGain").replaceChildren(i, t);
  }
  // 엽전 두 배, for an ad watched to the end. Offered only when 이어하기 isn't, so there's never two ad buttons at once.
  function syncDouble() {

    b.hidden = !$("revive").hidden || G.doubled || !(G.lastPay > 0) || !platform().rewardReady();

  $("double").addEventListener("click", async () => {

    if (!earned) return syncDouble();

  });
  function buyWithCoins(id) {
    const sk = HERO_SKINS[id];

    $("shopNote").textContent = `${sk.name}${josa(sk.name, "을", "를")} 입었다. 엽전 -${fmt(sk.coin)}`;

  }
  addCoins(0); drillDay(); renderDrills();

  // ------------------------------------------------------------------ 죽림 명부 (the shared ranking, kept by this game's server)
  // the browser keeps a random secret; the server shows others only a hash of it (myId)
  const key = (() => {
    let k = store.get("key", "");
    if (!/^[0-9a-f]{32}$/.test(k)) {
      k = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, "0")).join("");
      store.set("key", k);
    }

  })();
  // one 명부 per training mode; the start screen shows either, by its tabs
  const boards = { normal: { rows: [], best: 0 }, red: { rows: [], best: 0 }, hard: { rows: [], best: 0 }, mon: { rows: [], best: 0 } };
  let online = false, myId = null, rankNote = "", shown = boards[store.get("board", "normal")] ? store.get("board", "normal") : "normal";
  function renderRank() {
    const rows = boards[shown].rows;
    for (const t of document.querySelectorAll(".rank__tabs button")) t.classList.toggle("is-on", t.dataset.mode === shown);
    for (const id of ["rankStart", "rankOver"]) {

  function take(mode, data) {
    online = true; rankNote = "";
    boards[mode].rows = (data.top || []).map((r) => ({ id: String(r.id), nick: String(r.nick || "무명 검객").slice(0, 10), best: Number(r.best) || 0 }))
      .filter((r) => r.best > 0 && r.best < 100000);

    renderRank();
  }
  for (const t of document.querySelectorAll(".rank__tabs button")) t.addEventListener("click", () => { shown = t.dataset.mode; store.set("board", shown); renderRank(); refresh(shown); });
  // 앱인토스 번들은 토스 도메인에서 뜨므로 명부 서버를 절대 주소로 가리켜야 한다.
  // 비워두면 지금처럼 같은 서버를 쓴다. 예: "https://juklim.내주소.com"
  // The 명부 lives on Cloudflare (juklim/worker), one ranking for every copy of the game: the PC link, the GitHub Pages
  // page, the 토스 bundle. A wrapper can still set window.JUKLIM_API_BASE before this script runs; null means no 명부.
  const SCORES_URL = "https://bamboo-dodge-scores.gswx31.workers.dev";
  const API_BASE = window.JUKLIM_API_BASE === undefined ? SCORES_URL : window.JUKLIM_API_BASE;
  if (API_BASE === null) $("nick").hidden = true; // the name is only for the 명부: with none, don't ask for it
  async function api(mode, body) {
    const r = await fetch(API_BASE + "/api/scores" + (mode === "normal" ? "" : "?mode=" + mode), body
      ? { method: "POST", headers: { "content-type": "application/json", "x-key": key }, body: JSON.stringify(body) }
      : { headers: { "x-key": key } });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  async function refresh(mode = shown) {
    if (API_BASE === null) return;
    try { take(mode, await api(mode)); }
    catch { if (!online) { rankNote = "명부를 불러오지 못했다."; renderRank(); } }
  }
  async function submit(mode, score) { // always sent: the server keeps each name's best, so a new name gets its own row
    if (!(score > 0) || API_BASE === null) return;
    try { take(mode, await api(mode, { nick: ($("nick").value || "무명 검객").slice(0, 10), best: score, stage: G.stage })); }
    catch { rankNote = "명부에 이름을 올리지 못했다."; renderRank(); }
  }
  refresh("normal"); refresh("red"); refresh("hard"); refresh("mon");
  setInterval(() => { if (G.mode !== "play" && !document.hidden) refresh(shown); }, 15000);

  // ------------------------------------------------------------------ go
  addEventListener("resize", resize);
  new ResizeObserver(resize).observe(app);
  resize();
  P.x = W / 2; P.y = H * 0.58;
  requestAnimationFrame(frame);
  requestAnimationFrame(hud);
})();
</script>
</body>
</html>
